<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Stock</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap');
  :root {
    --bg:#0f0f0f;--surface:#1a1a1a;--card:#222;--border:#2e2e2e;
    --accent:#f0c040;--green:#4caf7d;--red:#e05c3a;--orange:#f0a040;
    --blue:#5b9cf6;--text:#f0ede6;--muted:#888;--radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px;}
  header{background:var(--surface);padding:22px 20px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
  header h1{font-size:22px;font-weight:800;}
  header h1 span{color:var(--accent);}
  .sync-status{font-size:11px;margin-top:4px;font-family:'DM Mono',monospace;}
  .sync-ok{color:var(--green);}.sync-loading{color:var(--orange);}.sync-error{color:var(--red);}
  nav{display:flex;gap:6px;margin-top:14px;}
  nav button{flex:1;padding:9px 4px;border:1.5px solid var(--border);background:transparent;color:var(--muted);border-radius:10px;font-family:'Syne',sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
  nav button.active{background:var(--accent);color:#111;border-color:var(--accent);}
  .section{display:none;padding:20px;}.section.active{display:block;}
  .section-title{font-size:18px;font-weight:800;margin-bottom:18px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
  .card.alerte{border-color:var(--red);background:rgba(224,92,58,0.08);}
  .card.ok{border-color:var(--green);}
  .item-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
  .item-name{font-size:16px;font-weight:700;}
  .item-cat{font-size:11px;color:var(--muted);margin-top:2px;}
  .badge-alerte{font-size:10px;font-weight:800;background:var(--red);color:#fff;padding:2px 7px;border-radius:5px;}
  .qty-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
  .qty-controls{display:flex;align-items:center;gap:12px;}
  .qty-btn{width:40px;height:40px;border:none;border-radius:10px;font-size:22px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .qty-btn.minus{background:rgba(224,92,58,0.2);color:var(--red);}
  .qty-btn.plus{background:rgba(76,175,125,0.2);color:var(--green);}
  .qty-val{font-family:'DM Mono',monospace;font-size:22px;font-weight:700;min-width:50px;text-align:center;}
  .qty-unit{font-size:12px;color:var(--muted);margin-top:2px;text-align:center;}
  .seuil-info{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;}
  .transfert-btn{margin-top:10px;width:100%;padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Syne',sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
  .form-group{margin-bottom:14px;}
  .form-group label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}
  input,select{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:13px 14px;color:var(--text);font-family:'Syne',sans-serif;font-size:15px;outline:none;-webkit-appearance:none;}
  input:focus,select:focus{border-color:var(--accent);}
  input[type="number"]{font-family:'DM Mono',monospace;}
  select option{background:#222;}
  .btn{width:100%;padding:15px;border:none;border-radius:12px;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;}
  .btn-primary{background:var(--accent);color:#111;}
  .btn-danger{background:var(--red);color:#fff;}
  .btn-secondary{background:var(--surface);color:var(--text);border:1.5px solid var(--border);}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;overflow-y:auto;padding:20px;}
  .modal-overlay.open{display:block;}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;max-width:500px;margin:30px auto 60px;}
  .modal h2{font-size:18px;font-weight:800;margin-bottom:20px;}
  .empty-state{text-align:center;color:var(--muted);padding:40px 0;font-size:14px;}
  .empty-state .icon{font-size:36px;margin-bottom:10px;}
  .search-box{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);font-family:'Syne',sans-serif;font-size:14px;outline:none;margin-bottom:16px;}
  .search-box:focus{border-color:var(--accent);}
  .stats-row{display:flex;gap:10px;margin-bottom:16px;}
  .stat-box{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;}
  .stat-val{font-family:'DM Mono',monospace;font-size:20px;font-weight:700;}
  .stat-label{font-size:11px;color:var(--muted);margin-top:2px;}
  .toggle-group{display:flex;gap:8px;}
  .toggle-btn{flex:1;padding:12px;border:2px solid var(--border);border-radius:10px;background:transparent;color:var(--muted);font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
  .toggle-btn.sel{border-color:var(--accent);color:var(--accent);background:rgba(240,192,64,0.1);}
  .transfert-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:300;overflow-y:auto;padding:20px;}
  .transfert-modal-overlay.open{display:block;}
</style>
</head>
<body>
<header>
  <h1>Mon <span>Stock</span></h1>
  <div class="sync-status" id="sync-status">Connexion...</div>
  <nav>
    <button class="active" onclick="showSection('lyon')">📦 Lyon 5e</button>
    <button onclick="showSection('bagnols')">📦 Bagnols</button>
    <button onclick="showSection('ajouter')">+ Ajouter</button>
  </nav>
</header>

<div id="lyon" class="section active">
  <p class="section-title">Stock Lyon 5ème</p>
  <input class="search-box" type="text" placeholder="Rechercher un article..." oninput="renderStock('lyon')" id="search-lyon" />
  <div class="stats-row">
    <div class="stat-box"><div class="stat-val" id="total-lyon">0</div><div class="stat-label">Articles</div></div>
    <div class="stat-box"><div class="stat-val" style="color:var(--red)" id="alerte-lyon">0</div><div class="stat-label">Alertes</div></div>
  </div>
  <div id="list-lyon"></div>
</div>

<div id="bagnols" class="section">
  <p class="section-title">Stock Bagnols</p>
  <input class="search-box" type="text" placeholder="Rechercher un article..." oninput="renderStock('bagnols')" id="search-bagnols" />
  <div class="stats-row">
    <div class="stat-box"><div class="stat-val" id="total-bagnols">0</div><div class="stat-label">Articles</div></div>
    <div class="stat-box"><div class="stat-val" style="color:var(--red)" id="alerte-bagnols">0</div><div class="stat-label">Alertes</div></div>
  </div>
  <div id="list-bagnols"></div>
</div>

<div id="ajouter" class="section">
  <p class="section-title">Ajouter un article</p>
  <div class="card">
    <div class="form-group">
      <label>Nom de l'article</label>
      <input type="text" id="new-nom" placeholder="Ex: Peinture blanche" />
    </div>
    <div class="form-group">
      <label>Categorie</label>
      <input type="text" id="new-cat" placeholder="Ex: Peinture, Electricite, Plomberie..." />
    </div>
    <div class="form-group">
      <label>Unite</label>
      <input type="text" id="new-unite" placeholder="Ex: rouleaux, sacs, metres, pieces..." />
    </div>
    <div class="form-group">
      <label>Stock initial</label>
      <input type="number" id="new-qty" placeholder="0" min="0" step="1" />
    </div>
    <div class="form-group">
      <label>Seuil d'alerte (quantite minimum)</label>
      <input type="number" id="new-seuil" placeholder="Ex: 2" min="0" step="1" />
    </div>
    <div class="form-group">
      <label>Dans quel stock ?</label>
      <div class="toggle-group">
        <button class="toggle-btn" id="btn-stock-lyon" onclick="setStock('lyon')">📦 Lyon 5e</button>
        <button class="toggle-btn" id="btn-stock-bagnols" onclick="setStock('bagnols')">📦 Bagnols</button>
        <button class="toggle-btn" id="btn-stock-les2" onclick="setStock('les2')">📦 Les deux</button>
      </div>
    </div>
    <button class="btn btn-primary" onclick="ajouterArticle()">Ajouter au stock</button>
  </div>
</div>

<!-- MODAL EDIT -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2 id="modal-nom">Article</h2>
    <div class="form-group">
      <label>Nom</label>
      <input type="text" id="edit-nom" />
    </div>
    <div class="form-group">
      <label>Categorie</label>
      <input type="text" id="edit-cat" />
    </div>
    <div class="form-group">
      <label>Unite</label>
      <input type="text" id="edit-unite" />
    </div>
    <div class="form-group">
      <label>Quantite</label>
      <input type="number" id="edit-qty" min="0" step="1" />
    </div>
    <div class="form-group">
      <label>Seuil d'alerte</label>
      <input type="number" id="edit-seuil" min="0" step="1" />
    </div>
    <button class="btn btn-primary" onclick="sauvegarderArticle()">Sauvegarder</button>
    <button class="btn btn-secondary" onclick="fermerModal()">Annuler</button>
    <button class="btn btn-danger" onclick="supprimerArticle()">Supprimer</button>
  </div>
</div>

<!-- MODAL TRANSFERT -->
<div class="transfert-modal-overlay" id="transfert-modal">
  <div class="modal">
    <h2>Transferer</h2>
    <p id="transfert-info" style="color:var(--muted);font-size:14px;margin-bottom:20px;"></p>
    <div class="form-group">
      <label>Quantite a transferer</label>
      <input type="number" id="transfert-qty" min="1" step="1" placeholder="0" />
    </div>
    <button class="btn btn-primary" onclick="confirmerTransfert()">Transferer</button>
    <button class="btn btn-secondary" onclick="fermerTransfert()">Annuler</button>
  </div>
</div>

<script>
var BIN_ID = '6a344e7fda38895dfed987e9';
var API_KEY = '$2a$10$sRHPt6zqWj6D0X9vNmu6o0Js0VZsHGuLE/y9G1Px.0WuvnNjBMwtC';
var API_URL = 'https://api.jsonbin.io/v3/b/' + BIN_ID;

var data = {lyon:[], bagnols:[]};
var currentSection = 'lyon';
var editSection = null;
var editIndex = null;
var newStock = null;
var transfertSection = null;
var transfertIndex = null;

function setStatus(msg, cls) {
  var el = document.getElementById('sync-status');
  el.textContent = msg;
  el.className = 'sync-status ' + cls;
}

function chargerDonnees() {
  setStatus('Chargement...', 'sync-loading');
  return fetch(API_URL + '/latest', {headers:{'X-Access-Key':API_KEY}})
    .then(function(r){ return r.json(); })
    .then(function(d){
      data = d.record;
      if(!data.lyon) data.lyon = [];
      if(!data.bagnols) data.bagnols = [];
      setStatus('Synchronise', 'sync-ok');
      renderStock('lyon');
      renderStock('bagnols');
    })
    .catch(function(){ setStatus('Erreur de connexion', 'sync-error'); });
}

function sauverEnLigne() {
  setStatus('Sauvegarde...', 'sync-loading');
  return fetch(API_URL, {
    method:'PUT',
    headers:{'Content-Type':'application/json','X-Access-Key':API_KEY},
    body:JSON.stringify(data)
  })
  .then(function(){ setStatus('Synchronise', 'sync-ok'); })
  .catch(function(){ setStatus('Erreur sauvegarde', 'sync-error'); });
}

function showSection(id) {
  document.querySelectorAll('.section').forEach(function(s){s.classList.remove('active');});
  document.querySelectorAll('nav button').forEach(function(b){b.classList.remove('active');});
  document.getElementById(id).classList.add('active');
  ['lyon','bagnols','ajouter'].forEach(function(s,i){
    if(s===id) document.querySelectorAll('nav button')[i].classList.add('active');
  });
  currentSection = id;
  if(id==='lyon'||id==='bagnols') chargerDonnees();
}

function setStock(val) {
  newStock = val;
  document.getElementById('btn-stock-lyon').className = 'toggle-btn'+(val==='lyon'?' sel':'');
  document.getElementById('btn-stock-bagnols').className = 'toggle-btn'+(val==='bagnols'?' sel':'');
  document.getElementById('btn-stock-les2').className = 'toggle-btn'+(val==='les2'?' sel':'');
}

function renderStock(depot) {
  var search = document.getElementById('search-'+depot).value.toLowerCase();
  var items = data[depot] || [];
  var filtered = items.filter(function(a){ return a.nom.toLowerCase().includes(search) || (a.cat||'').toLowerCase().includes(search); });
  var alertes = items.filter(function(a){ return a.qty <= (a.seuil||0); }).length;
  document.getElementById('total-'+depot).textContent = items.length;
  document.getElementById('alerte-'+depot).textContent = alertes;

  var container = document.getElementById('list-'+depot);
  if(!filtered.length){
    container.innerHTML = '<div class="empty-state"><div class="icon">📦</div>Aucun article.<br>Appuie sur + Ajouter.</div>';
    return;
  }

  // Trier : alertes en premier
  filtered.sort(function(a,b){
    var aAlert = a.qty <= (a.seuil||0) ? 0 : 1;
    var bAlert = b.qty <= (b.seuil||0) ? 0 : 1;
    return aAlert - bAlert;
  });

  var dest = depot === 'lyon' ? 'bagnols' : 'lyon';
  var destLabel = depot === 'lyon' ? 'Bagnols' : 'Lyon 5e';

  container.innerHTML = filtered.map(function(a, i){
    var realIndex = data[depot].indexOf(a);
    var isAlerte = a.qty <= (a.seuil||0);
    var cardClass = isAlerte ? 'card alerte' : 'card ok';
    return '<div class="'+cardClass+'">' +
      '<div class="item-header">' +
        '<div>' +
          '<div class="item-name">'+a.nom+'</div>' +
          '<div class="item-cat">'+(a.cat||'')+'</div>' +
        '</div>' +
        (isAlerte ? '<span class="badge-alerte">STOCK BAS</span>' : '') +
      '</div>' +
      '<div class="qty-row">' +
        '<div class="qty-controls">' +
          '<button class="qty-btn minus" onclick="changeQty(\''+depot+'\','+realIndex+',-1)">−</button>' +
          '<div>' +
            '<div class="qty-val">'+a.qty+'</div>' +
            '<div class="qty-unit">'+(a.unite||'')+'</div>' +
          '</div>' +
          '<button class="qty-btn plus" onclick="changeQty(\''+depot+'\','+realIndex+',+1)">+</button>' +
        '</div>' +
        '<div class="seuil-info">Seuil : '+(a.seuil||0)+' '+(a.unite||'')+'<br><span style="color:var(--blue);cursor:pointer" onclick="ouvrirModal(\''+depot+'\','+realIndex+')">✏️ Modifier</span></div>' +
      '</div>' +
      '<button class="transfert-btn" onclick="ouvrirTransfert(\''+depot+'\','+realIndex+')">↔️ Transferer vers '+destLabel+'</button>' +
    '</div>';
  }).join('');
}

function changeQty(depot, i, delta) {
  var newQty = (data[depot][i].qty || 0) + delta;
  if(newQty < 0) newQty = 0;
  data[depot][i].qty = newQty;
  sauverEnLigne().then(function(){ renderStock(depot); });
}

function ouvrirModal(depot, i) {
  editSection = depot;
  editIndex = i;
  var a = data[depot][i];
  document.getElementById('modal-nom').textContent = a.nom;
  document.getElementById('edit-nom').value = a.nom;
  document.getElementById('edit-cat').value = a.cat || '';
  document.getElementById('edit-unite').value = a.unite || '';
  document.getElementById('edit-qty').value = a.qty || 0;
  document.getElementById('edit-seuil').value = a.seuil || 0;
  document.getElementById('modal-overlay').classList.add('open');
}

function fermerModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  editSection = null; editIndex = null;
}

function sauvegarderArticle() {
  data[editSection][editIndex].nom = document.getElementById('edit-nom').value.trim();
  data[editSection][editIndex].cat = document.getElementById('edit-cat').value.trim();
  data[editSection][editIndex].unite = document.getElementById('edit-unite').value.trim();
  data[editSection][editIndex].qty = parseInt(document.getElementById('edit-qty').value) || 0;
  data[editSection][editIndex].seuil = parseInt(document.getElementById('edit-seuil').value) || 0;
  sauverEnLigne().then(function(){ fermerModal(); renderStock(editSection||currentSection); });
}

function supprimerArticle() {
  if(!confirm('Supprimer cet article ?')) return;
  var s = editSection;
  data[s].splice(editIndex, 1);
  sauverEnLigne().then(function(){ fermerModal(); renderStock(s); });
}

function ajouterArticle() {
  var nom = document.getElementById('new-nom').value.trim();
  var cat = document.getElementById('new-cat').value.trim();
  var unite = document.getElementById('new-unite').value.trim();
  var qty = parseInt(document.getElementById('new-qty').value) || 0;
  var seuil = parseInt(document.getElementById('new-seuil').value) || 0;
  if(!nom){ alert('Entre le nom de l\'article.'); return; }
  if(!newStock){ alert('Choisis dans quel stock.'); return; }

  var article = {nom:nom, cat:cat, unite:unite, qty:qty, seuil:seuil};

  if(newStock === 'les2') {
    data.lyon.push(Object.assign({}, article));
    data.bagnols.push(Object.assign({}, article));
  } else {
    data[newStock].push(article);
  }

  sauverEnLigne().then(function(){
    document.getElementById('new-nom').value='';
    document.getElementById('new-cat').value='';
    document.getElementById('new-unite').value='';
    document.getElementById('new-qty').value='';
    document.getElementById('new-seuil').value='';
    newStock = null;
    document.getElementById('btn-stock-lyon').className='toggle-btn';
    document.getElementById('btn-stock-bagnols').className='toggle-btn';
    document.getElementById('btn-stock-les2').className='toggle-btn';
    alert('Article ajoute !');
    showSection('lyon');
  });
}

// TRANSFERT
function ouvrirTransfert(depot, i) {
  transfertSection = depot;
  transfertIndex = i;
  var a = data[depot][i];
  var dest = depot === 'lyon' ? 'Bagnols' : 'Lyon 5e';
  document.getElementById('transfert-info').textContent = a.nom + ' — Stock actuel : ' + a.qty + ' ' + (a.unite||'') + ' → vers ' + dest;
  document.getElementById('transfert-qty').value = '';
  document.getElementById('transfert-modal').classList.add('open');
}

function fermerTransfert() {
  document.getElementById('transfert-modal').classList.remove('open');
  transfertSection = null; transfertIndex = null;
}

function confirmerTransfert() {
  var qty = parseInt(document.getElementById('transfert-qty').value) || 0;
  if(qty <= 0){ alert('Entre une quantite valide.'); return; }
  var src = transfertSection;
  var dest = src === 'lyon' ? 'bagnols' : 'lyon';
  var article = data[src][transfertIndex];

  if(qty > article.qty){ alert('Stock insuffisant !'); return; }

  // Retirer du stock source
  data[src][transfertIndex].qty -= qty;

  // Chercher si article existe dans destination
  var destIndex = data[dest].findIndex(function(a){ return a.nom.toLowerCase() === article.nom.toLowerCase(); });
  if(destIndex >= 0) {
    data[dest][destIndex].qty += qty;
  } else {
    // Creer l'article dans la destination
    data[dest].push({nom:article.nom, cat:article.cat, unite:article.unite, qty:qty, seuil:article.seuil});
  }

  sauverEnLigne().then(function(){
    fermerTransfert();
    renderStock(src);
    renderStock(dest);
    alert('Transfert effectue !');
  });
}

chargerDonnees();
</script>
</body>
</html>
