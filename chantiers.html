<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mes Chantiers</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap');
  :root {
    --bg:#0f0f0f;--surface:#1a1a1a;--card:#222;--border:#2e2e2e;
    --accent:#f0c040;--green:#4caf7d;--red:#e05c3a;--blue:#5b9cf6;
    --orange:#f0a040;--text:#f0ede6;--muted:#888;--radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:50px;}
  header{background:var(--surface);padding:22px 20px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
  header h1{font-size:22px;font-weight:800;}
  header h1 span{color:var(--accent);}
  .sync-status{font-size:11px;margin-top:4px;font-family:'DM Mono',monospace;}
  .sync-ok{color:var(--green);}.sync-loading{color:var(--orange);}.sync-error{color:var(--red);}
  nav{display:flex;gap:4px;margin-top:14px;}
  nav button{flex:1;padding:8px 2px;border:1.5px solid var(--border);background:transparent;color:var(--muted);border-radius:10px;font-family:'Syne',sans-serif;font-size:11px;font-weight:600;cursor:pointer;}
  nav button.active{background:var(--accent);color:#111;border-color:var(--accent);}
  .section{display:none;padding:20px;}.section.active{display:block;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;cursor:pointer;}
  .card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
  .client-name{font-size:17px;font-weight:700;}
  .chip{font-family:'DM Mono',monospace;font-size:11px;padding:3px 9px;border-radius:6px;font-weight:600;}
  .chip-fab{background:rgba(91,156,246,0.15);color:var(--blue);}
  .chip-aym{background:rgba(240,160,64,0.15);color:var(--orange);}
  .row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:14px;}
  .row:last-child{border-bottom:none;}
  .row label{color:var(--muted);font-size:13px;}
  .mono{font-family:'DM Mono',monospace;font-size:14px;font-weight:500;}
  .green{color:var(--green);}.red{color:var(--red);}.yellow{color:var(--accent);}.blue{color:var(--blue);}.orange{color:var(--orange);}
  .divider{border:none;border-top:1px dashed var(--border);margin:10px 0;}
  .section-title{font-size:18px;font-weight:800;margin-bottom:18px;}
  .form-group{margin-bottom:14px;}
  .form-group label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}
  input,select{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:13px 14px;color:var(--text);font-family:'Syne',sans-serif;font-size:15px;outline:none;-webkit-appearance:none;}
  input:focus{border-color:var(--accent);}
  input[type="number"]{font-family:'DM Mono',monospace;}
  textarea{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:13px 14px;color:var(--text);font-family:'Syne',sans-serif;font-size:15px;outline:none;resize:vertical;min-height:100px;line-height:1.6;}
  textarea:focus{border-color:var(--accent);}
  .toggle-group{display:flex;gap:8px;}
  .toggle-btn{flex:1;padding:12px;border:2px solid var(--border);border-radius:10px;background:transparent;color:var(--muted);font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
  .toggle-btn.sel-fab{border-color:var(--blue);color:var(--blue);background:rgba(91,156,246,0.1);}
  .toggle-btn.sel-aym{border-color:var(--orange);color:var(--orange);background:rgba(240,160,64,0.1);}
  .toggle-btn.sel-green{border-color:var(--green);color:var(--green);background:rgba(76,175,125,0.1);}
  .btn{width:100%;padding:15px;border:none;border-radius:12px;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;}
  .btn-primary{background:var(--accent);color:#111;}
  .btn-secondary{background:var(--surface);color:var(--text);border:1.5px solid var(--border);}
  .btn-danger{background:var(--red);color:#fff;}
  .btn-green{background:var(--green);color:#fff;}
  .depense-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);}
  .depense-item:last-child{border-bottom:none;}
  .depense-who{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;flex-shrink:0;}
  .who-fab{background:rgba(91,156,246,0.15);color:var(--blue);}
  .who-aym{background:rgba(240,160,64,0.15);color:var(--orange);}
  .depense-desc{flex:1;font-size:13px;}
  .depense-mnt{font-family:'DM Mono',monospace;font-size:13px;color:var(--red);flex-shrink:0;}
  .del-btn{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:2px 6px;flex-shrink:0;}
  .add-dep-grid{display:grid;grid-template-columns:1fr 90px;gap:8px;margin-top:10px;}
  .add-dep-grid input{padding:11px 12px;font-size:14px;}
  .who-toggle{display:flex;gap:6px;margin-top:8px;}
  .who-btn{flex:1;padding:10px;border:2px solid var(--border);border-radius:9px;background:transparent;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);}
  .who-btn.sel-fab{border-color:var(--blue);color:var(--blue);background:rgba(91,156,246,0.1);}
  .who-btn.sel-aym{border-color:var(--orange);color:var(--orange);background:rgba(240,160,64,0.1);}
  .add-dep-btn{width:100%;margin-top:8px;padding:11px;background:var(--accent);border:none;border-radius:10px;color:#111;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;cursor:pointer;}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;overflow-y:auto;padding:20px;}
  .modal-overlay.open{display:block;}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;max-width:500px;margin:30px auto 60px;position:relative;}
  .modal h2{font-size:18px;font-weight:800;margin-bottom:20px;padding-right:40px;}
  .close-btn{position:absolute;top:20px;right:20px;background:var(--surface);border:1px solid var(--border);border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer;color:var(--text);display:flex;align-items:center;justify-content:center;font-weight:700;}
  .notes-preview{margin-top:10px;padding:10px 12px;background:var(--surface);border-radius:8px;border-left:3px solid var(--accent);font-size:13px;color:var(--text);line-height:1.5;white-space:pre-wrap;}
  .summary-block{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px;}
  .summary-block h3{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;}
  .big-number{font-family:'DM Mono',monospace;font-size:28px;font-weight:500;line-height:1;}
  .person-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
  .person-row:last-child{border-bottom:none;}
  .person-label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;}
  .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .dot-fab{background:var(--blue);}.dot-aym{background:var(--orange);}
  .arrow-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-top:12px;font-size:13px;line-height:1.6;}
  .arrow-box strong{color:var(--accent);}
  .arrow-box-big{background:var(--surface);border:2px solid var(--accent);border-radius:10px;padding:14px;margin-top:8px;font-size:15px;font-weight:700;line-height:1.6;text-align:center;}
  .arrow-box-big strong{color:var(--accent);font-size:17px;}
  .tag-date{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;}
  .empty-state{text-align:center;color:var(--muted);padding:40px 0;font-size:14px;}
  .empty-state .icon{font-size:36px;margin-bottom:10px;}
  .sub-label{font-size:11px;color:var(--muted);margin-top:4px;}
  .especes-badge{font-size:11px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px;padding:4px 0;}
  .check-row{display:flex;align-items:center;gap:10px;margin-top:8px;padding:10px 12px;background:var(--surface);border-radius:10px;border:1px solid var(--border);}
  .check-row input[type="checkbox"]{width:22px;height:22px;cursor:pointer;flex-shrink:0;-webkit-appearance:checkbox;appearance:checkbox;}
  .check-row span{font-size:13px;font-weight:600;color:var(--text);}
  .perf-box{margin-top:10px;padding:12px;background:var(--surface);border-radius:10px;border:1px solid var(--border);}
  .perf-box label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:6px;}
  .perf-input-row{display:flex;gap:8px;align-items:center;}
  .perf-input-row input{width:80px;padding:8px 10px;font-size:14px;flex-shrink:0;}
  .perf-result{margin-top:10px;padding:10px;border-radius:8px;font-size:13px;font-weight:700;text-align:center;}
  .perf-ok{background:rgba(76,175,125,0.15);border:1px solid var(--green);color:var(--green);}
  .perf-bad{background:rgba(224,92,58,0.15);border:1px solid var(--red);color:var(--red);}
  .demande-card{background:var(--card);border-left:4px solid var(--green);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
  .demande-card.orange{border-left-color:var(--orange);}
  .demande-card.rouge{border-left-color:var(--red);}
  .demande-card.rappel{border-left-color:var(--blue);border:2px solid var(--blue);}
  .demande-nom{font-size:16px;font-weight:700;}
  .demande-desc{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5;}
  .demande-meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
  .demande-tel{font-size:12px;color:var(--blue);}
  .badge-urgence{font-size:10px;font-weight:800;padding:2px 8px;border-radius:5px;}
  .badge-vert{background:rgba(76,175,125,0.2);color:var(--green);}
  .badge-orange{background:rgba(240,160,64,0.2);color:var(--orange);}
  .badge-rouge{background:rgba(224,92,58,0.2);color:var(--red);}
  .badge-rappel{background:rgba(91,156,246,0.2);color:var(--blue);}
  .status-badge{font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;display:inline-block;margin-bottom:8px;}
  .status-validation{background:rgba(240,192,64,0.15);color:var(--accent);border:1px solid var(--accent);}
  .status-rappel{background:rgba(91,156,246,0.15);color:var(--blue);border:1px solid var(--blue);}
  .btn-suppr-dem{width:100%;margin-top:8px;padding:12px;background:rgba(224,92,58,0.15);border:1px solid var(--red);border-radius:10px;color:var(--red);font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
</style>
</head>
<body>
<header>
  <h1>Mes <span>Chantiers</span></h1>
  <div class="sync-status" id="sync-status">Connexion...</div>
  <nav>
    <button class="active" onclick="showSection('liste')">Liste</button>
    <button onclick="showSection('nouveau')">+ Nouveau</button>
    <button onclick="showSection('bilan')">Bilan</button>
    <button onclick="showSection('demandes')">Demandes</button>
  </nav>
</header>

<div id="liste" class="section active">
  <p class="section-title">Chantiers en cours</p>
  <div id="chantiers-list"></div>
</div>

<div id="nouveau" class="section">
  <p class="section-title">Nouveau chantier</p>
  <div class="card">
    <div class="form-group"><label>Nom du client</label><input type="text" id="new-client" placeholder="Ex: Dupont Jean" /></div>
    <div class="form-group"><label>Montant du devis (euros)</label><input type="number" id="new-devis" placeholder="0.00" step="0.01" min="0" /></div>
    <div class="form-group">
      <label>Responsable du chantier</label>
      <div class="toggle-group">
        <button class="toggle-btn" id="btn-resp-fab" onclick="setResp('Fabrice')">Fabrice</button>
        <button class="toggle-btn" id="btn-resp-aym" onclick="setResp('Aymeric')">Aymeric</button>
      </div>
      <p class="sub-label" id="resp-hint">Personne non selectionnee</p>
    </div>
    <div class="form-group">
      <label>Chantier declare ?</label>
      <div class="toggle-group">
        <button class="toggle-btn sel-green" id="btn-declare-oui" onclick="setDeclare(true)">Oui - URSSAF 24%</button>
        <button class="toggle-btn" id="btn-declare-non" onclick="setDeclare(false)">Non - En especes</button>
      </div>
    </div>
    <div class="form-group"><label>Date du chantier <span style="color:var(--red)">*</span></label><input type="date" id="new-date" required /></div>
    <button class="btn btn-primary" onclick="ajouterChantier()">Creer le chantier</button>
  </div>
</div>

<div id="bilan" class="section">
  <p class="section-title">Bilan global</p>
  <div id="bilan-content"></div>
  <button class="btn btn-green" onclick="exporterExcel()">Telecharger Excel</button>
</div>

<div id="demandes" class="section">
  <p class="section-title">Demandes clients</p>
  <div class="card" style="margin-bottom:20px;">
    <div class="form-group"><label>Prenom / Nom (optionnel)</label><input type="text" id="dem-nom" placeholder="Ex: Marie Dupont" /></div>
    <div class="form-group"><label>Telephone (optionnel)</label><input type="tel" id="dem-tel" placeholder="Ex: 06 12 34 56 78" /></div>
    <div class="form-group"><label>Ville / Lieu (optionnel)</label><input type="text" id="dem-lieu" placeholder="Ex: Lyon 3e" /></div>
    <div class="form-group"><label>Description de la demande</label><textarea id="dem-desc" placeholder="Ex: Renovation salle de bain..."></textarea></div>
    <button class="btn btn-primary" onclick="ajouterDemande()">Ajouter la demande</button>
  </div>
  <div id="demandes-list"></div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <button class="close-btn" onclick="fermerModal()">x</button>
    <h2 id="modal-title">Chantier</h2>
    <div class="form-group"><label>Client</label><input type="text" id="edit-client" /></div>
    <div class="form-group"><label>Montant devis (euros)</label><input type="number" id="edit-devis" step="0.01" /></div>
    <div class="form-group">
      <label>Responsable</label>
      <div class="toggle-group">
        <button class="toggle-btn" id="edit-btn-fab" onclick="setEditResp('Fabrice')">Fabrice</button>
        <button class="toggle-btn" id="edit-btn-aym" onclick="setEditResp('Aymeric')">Aymeric</button>
      </div>
    </div>
    <div class="form-group">
      <label>Chantier declare ?</label>
      <div class="toggle-group">
        <button class="toggle-btn" id="edit-btn-declare-oui" onclick="setEditDeclare(true)">Oui - URSSAF 24%</button>
        <button class="toggle-btn" id="edit-btn-declare-non" onclick="setEditDeclare(false)">Non - En especes</button>
      </div>
    </div>
    <div class="form-group">
      <label>Depenses</label>
      <div id="edit-depenses-list"></div>
      <div style="margin-top:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <p style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;margin-bottom:8px;">Ajouter une depense</p>
        <div class="add-dep-grid">
          <input type="text" id="dep-desc" placeholder="Description" />
          <input type="number" id="dep-mnt" placeholder="euros" step="0.01" min="0" />
        </div>
        <div class="who-toggle">
          <button class="who-btn" id="who-btn-fab" onclick="setWho('Fabrice')">Fabrice</button>
          <button class="who-btn" id="who-btn-aym" onclick="setWho('Aymeric')">Aymeric</button>
        </div>
        <button class="add-dep-btn" onclick="ajouterDepense()">+ Ajouter</button>
      </div>
    </div>
    <div class="form-group"><label>Notes libres</label><textarea id="edit-notes" placeholder="Materiaux a commander, choses a ne pas oublier..."></textarea></div>
    <button class="btn btn-primary" onclick="sauvegarderChantier()">Sauvegarder</button>
    <button class="btn btn-secondary" onclick="fermerModal()">Annuler</button>
    <button class="btn btn-danger" onclick="supprimerChantier()">Supprimer ce chantier</button>
  </div>
</div>

<div class="modal-overlay" id="demande-modal-overlay">
  <div class="modal">
    <button class="close-btn" onclick="fermerDemande()">x</button>
    <h2>Modifier la demande</h2>
    <div class="form-group"><label>Prenom / Nom</label><input type="text" id="dem-edit-nom" /></div>
    <div class="form-group"><label>Telephone</label><input type="tel" id="dem-edit-tel" /></div>
    <div class="form-group"><label>Ville / Lieu</label><input type="text" id="dem-edit-lieu" /></div>
    <div class="form-group"><label>Description</label><textarea id="dem-edit-desc"></textarea></div>
    <button class="btn btn-primary" onclick="sauvegarderDemande()">Sauvegarder</button>
    <button class="btn btn-secondary" onclick="fermerDemande()">Annuler</button>
    <button class="btn btn-danger" onclick="supprimerDemande()">Supprimer</button>
  </div>
</div>

<script>
var BIN_ID = '6a21d867da38895dfe888684';
var API_KEY = '$2a$10$NRRQdixtQ/NsijZcDxQ47OYwm3YGBJXnv56wrj6SZJOokRbWEhRa6';
var API_URL = 'https://api.jsonbin.io/v3/b/' + BIN_ID;
var URSSAF_TAUX = 0.24;
var OBJECTIF_JOUR = 270;

var chantiers = [];
var demandes = [];
var editIndex = null;
var demandeEditIndex = null;
var newResp = null;
var editResp = null;
var depWho = null;
var newDeclare = true;
var editDeclare = true;

function fmt(n){return Number(n).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' euros';}
function today(){return new Date().toISOString().split('T')[0];}
function setStatus(msg,cls){var el=document.getElementById('sync-status');el.textContent=msg;el.className='sync-status '+cls;}

function chargerDonnees(){
  setStatus('Chargement...','sync-loading');
  return fetch(API_URL+'/latest',{headers:{'X-Access-Key':API_KEY}})
    .then(function(r){return r.json();})
    .then(function(d){
      var rec=d.record;
      chantiers=rec.chantiers||[];
      demandes=rec.demandes||[];
      setStatus('Synchronise','sync-ok');
      renderListe();
    })
    .catch(function(){setStatus('Erreur de connexion','sync-error');});
}

function sauverEnLigne(){
  setStatus('Sauvegarde...','sync-loading');
  return fetch(API_URL+'/latest',{headers:{'X-Access-Key':API_KEY}})
    .then(function(r){return r.json();})
    .then(function(d){
      var record=d.record;
      record.chantiers=chantiers;
      record.demandes=demandes;
      return fetch(API_URL,{method:'PUT',headers:{'Content-Type':'application/json','X-Access-Key':API_KEY},body:JSON.stringify(record)});
    })
    .then(function(){setStatus('Synchronise','sync-ok');})
    .catch(function(){setStatus('Erreur sauvegarde','sync-error');});
}

function calcChantier(c){
  var devis=parseFloat(c.devis)||0;
  var declare=c.declare!==false;
  var urssaf=declare?devis*URSSAF_TAUX:0;
  var net=devis-urssaf;
  var dep=c.depenses||[];
  var depFab=dep.filter(function(d){return d.who==='Fabrice';}).reduce(function(s,d){return s+(parseFloat(d.mnt)||0);},0);
  var depAym=dep.filter(function(d){return d.who==='Aymeric';}).reduce(function(s,d){return s+(parseFloat(d.mnt)||0);},0);
  var totalDep=depFab+depAym;
  var resultatNet=net-totalDep;
  var part=resultatNet/2;
  var recoit_fab,recoit_aym,transfert;
  if(c.responsable==='Fabrice'){recoit_fab=part;recoit_aym=part+depAym;transfert={de:'Fabrice',a:'Aymeric',mnt:part+depAym};}
  else{recoit_aym=part;recoit_fab=part+depFab;transfert={de:'Aymeric',a:'Fabrice',mnt:part+depFab};}
  return {devis:devis,urssaf:urssaf,declare:declare,net:net,depFab:depFab,depAym:depAym,totalDep:totalDep,resultatNet:resultatNet,part:part,recoit_fab:recoit_fab,recoit_aym:recoit_aym,transfert:transfert};
}

function showSection(id){
  document.querySelectorAll('.section').forEach(function(s){s.classList.remove('active');});
  document.querySelectorAll('nav button').forEach(function(b){b.classList.remove('active');});
  document.getElementById(id).classList.add('active');
  ['liste','nouveau','bilan','demandes'].forEach(function(s,i){if(s===id)document.querySelectorAll('nav button')[i].classList.add('active');});
  if(id==='liste') chargerDonnees();
  if(id==='bilan') chargerDonnees().then(function(){renderBilan();});
  if(id==='demandes') chargerDonnees().then(function(){renderDemandes();});
}

function setResp(who){newResp=who;document.getElementById('btn-resp-fab').className='toggle-btn'+(who==='Fabrice'?' sel-fab':'');document.getElementById('btn-resp-aym').className='toggle-btn'+(who==='Aymeric'?' sel-aym':'');document.getElementById('resp-hint').textContent=who+' encaisse le devis et paie les charges';}
function setEditResp(who){editResp=who;document.getElementById('edit-btn-fab').className='toggle-btn'+(who==='Fabrice'?' sel-fab':'');document.getElementById('edit-btn-aym').className='toggle-btn'+(who==='Aymeric'?' sel-aym':'');}
function setDeclare(val){newDeclare=val;document.getElementById('btn-declare-oui').className='toggle-btn'+(val?' sel-green':'');document.getElementById('btn-declare-non').className='toggle-btn'+(!val?' sel-aym':'');}
function setEditDeclare(val){editDeclare=val;document.getElementById('edit-btn-declare-oui').className='toggle-btn'+(val?' sel-green':'');document.getElementById('edit-btn-declare-non').className='toggle-btn'+(!val?' sel-aym':'');}
function setWho(who){depWho=who;document.getElementById('who-btn-fab').className='who-btn'+(who==='Fabrice'?' sel-fab':'');document.getElementById('who-btn-aym').className='who-btn'+(who==='Aymeric'?' sel-aym':'');}
function toggleVirement(i,checked){chantiers[i].virement=checked;sauverEnLigne().then(function(){renderBilan();});}
function toggleLivre(i,checked){chantiers[i].livre=checked;sauverEnLigne().then(function(){renderBilan();renderListe();});}
function updateJours(i,val){chantiers[i].jours=parseInt(val)||0;sauverEnLigne().then(function(){renderBilan();});}

function renderListe(){
  var container=document.getElementById('chantiers-list');
  var actifs=chantiers.filter(function(c){return !c.livre;});
  actifs.sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  if(!actifs.length){container.innerHTML='<div class="empty-state"><div class="icon">🏗️</div>Aucun chantier en cours.<br>Appuie sur + Nouveau.</div>';return;}
  container.innerHTML=actifs.map(function(c){
    var realIndex=chantiers.indexOf(c);
    var r=calcChantier(c);
    var chipClass=c.responsable==='Fabrice'?'chip-fab':'chip-aym';
    var urssafLabel=r.declare?'URSSAF (24%)':'EN ESPECES';
    var urssafVal=r.declare?('-'+fmt(r.urssaf)):'<span style="color:var(--accent);font-weight:800">EN ESPECES</span>';
    var notesHtml=c.notes&&c.notes.trim()?'<div class="notes-preview">📝 '+c.notes.trim()+'</div>':'';
    return '<div class="card" onclick="ouvrirModal('+realIndex+')">' +
      (r.declare?'':'<div class="especes-badge">EN ESPECES</div>') +
      '<div class="card-header"><div><div class="client-name">'+c.client+'</div><div class="tag-date">'+(c.date||'')+'</div></div><div class="chip '+chipClass+'">'+c.responsable+'</div></div>' +
      '<div class="row"><label>Devis</label><span class="mono yellow">'+fmt(r.devis)+'</span></div>' +
      '<div class="row"><label>'+urssafLabel+'</label><span class="mono red">'+urssafVal+'</span></div>' +
      '<div class="row"><label>Dep. Fabrice</label><span class="mono red">-'+fmt(r.depFab)+'</span></div>' +
      '<div class="row"><label>Dep. Aymeric</label><span class="mono red">-'+fmt(r.depAym)+'</span></div>' +
      '<hr class="divider">' +
      '<div class="row"><label>Part Fabrice</label><span class="mono blue">'+fmt(r.recoit_fab)+'</span></div>' +
      '<div class="row"><label>Part Aymeric</label><span class="mono orange">'+fmt(r.recoit_aym)+'</span></div>' +
      '<div class="row"><label><b>Net total</b></label><span class="mono '+(r.resultatNet>=0?'green':'red')+'"><b>'+fmt(r.resultatNet)+'</b></span></div>' +
      '<div class="arrow-box" style="margin-top:10px"><strong>'+r.transfert.de+'</strong> verse <strong>'+fmt(r.transfert.mnt)+'</strong> a '+r.transfert.a+'</div>' +
      notesHtml+
    '</div>';
  }).join('');
}

function ajouterChantier(){
  var client=document.getElementById('new-client').value.trim();
  var devis=document.getElementById('new-devis').value;
  var date=document.getElementById('new-date').value;
  if(!client||!devis){alert('Remplis le nom et le montant.');return;}
  if(!date){alert('La date du chantier est obligatoire.');return;}
  if(!newResp){alert('Choisis le responsable.');return;}
  chantiers.push({client:client,devis:parseFloat(devis),date:date,responsable:newResp,declare:newDeclare,virement:false,livre:false,jours:0,notes:'',depenses:[]});
  sauverEnLigne().then(function(){
    document.getElementById('new-client').value='';
    document.getElementById('new-devis').value='';
    document.getElementById('new-date').value='';
    newResp=null;newDeclare=true;
    document.getElementById('btn-resp-fab').className='toggle-btn';
    document.getElementById('btn-resp-aym').className='toggle-btn';
    document.getElementById('resp-hint').textContent='Personne non selectionnee';
    document.getElementById('btn-declare-oui').className='toggle-btn sel-green';
    document.getElementById('btn-declare-non').className='toggle-btn';
    alert('Chantier cree !');
    showSection('liste');
  });
}

function ouvrirModal(i){
  editIndex=i;depWho=null;
  var c=chantiers[i];
  document.getElementById('modal-title').textContent=c.client;
  document.getElementById('edit-client').value=c.client;
  document.getElementById('edit-devis').value=c.devis;
  document.getElementById('edit-notes').value=c.notes||'';
  document.getElementById('dep-desc').value='';
  document.getElementById('dep-mnt').value='';
  document.getElementById('who-btn-fab').className='who-btn';
  document.getElementById('who-btn-aym').className='who-btn';
  setEditResp(c.responsable||'Fabrice');
  setEditDeclare(c.declare!==false);
  renderDepensesModal();
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('modal-overlay').scrollTop=0;
}
function fermerModal(){document.getElementById('modal-overlay').classList.remove('open');editIndex=null;}
function renderDepensesModal(){
  var list=document.getElementById('edit-depenses-list');
  var dep=(chantiers[editIndex]&&chantiers[editIndex].depenses)||[];
  if(!dep.length){list.innerHTML='<p style="color:var(--muted);font-size:13px;padding:6px 0;">Aucune depense</p>';return;}
  list.innerHTML=dep.map(function(d,i){
    return '<div class="depense-item"><span class="depense-who '+(d.who==='Fabrice'?'who-fab':'who-aym')+'">'+(d.who==='Fabrice'?'Fab':'Aym')+'</span><span class="depense-desc">'+d.desc+'</span><span class="depense-mnt">-'+fmt(d.mnt)+'</span><button class="del-btn" onclick="supprimerDepense('+i+')">x</button></div>';
  }).join('');
}
function ajouterDepense(){
  var desc=document.getElementById('dep-desc').value.trim()||'Depense';
  var mnt=parseFloat(document.getElementById('dep-mnt').value);
  if(!mnt||mnt<=0){alert('Entre un montant valide.');return;}
  if(!depWho){alert('Choisis qui a paye.');return;}
  chantiers[editIndex].depenses.push({desc:desc,mnt:mnt,who:depWho});
  sauverEnLigne().then(function(){document.getElementById('dep-desc').value='';document.getElementById('dep-mnt').value='';depWho=null;document.getElementById('who-btn-fab').className='who-btn';document.getElementById('who-btn-aym').className='who-btn';renderDepensesModal();});
}
function supprimerDepense(i){chantiers[editIndex].depenses.splice(i,1);sauverEnLigne().then(function(){renderDepensesModal();});}
function sauvegarderChantier(){
  var client=document.getElementById('edit-client').value.trim();
  var devis=parseFloat(document.getElementById('edit-devis').value);
  if(!client||!devis){alert('Donnees incompletes.');return;}
  chantiers[editIndex].client=client;
  chantiers[editIndex].devis=devis;
  chantiers[editIndex].responsable=editResp;
  chantiers[editIndex].declare=editDeclare;
  chantiers[editIndex].notes=document.getElementById('edit-notes').value;
  sauverEnLigne().then(function(){fermerModal();renderListe();});
}
function supprimerChantier(){
  if(!confirm('Supprimer ce chantier ?'))return;
  chantiers.splice(editIndex,1);
  sauverEnLigne().then(function(){fermerModal();renderListe();});
}

function joursDepuis(dateStr){var d=new Date(dateStr);var now=new Date();return Math.floor((now-d)/(1000*60*60*24));}

function ajouterDemande(){
  var nom=document.getElementById('dem-nom').value.trim();
  var tel=document.getElementById('dem-tel').value.trim();
  var lieu=document.getElementById('dem-lieu').value.trim();
  var desc=document.getElementById('dem-desc').value.trim();
  if(!desc){alert('Entre au moins une description.');return;}
  demandes.push({nom:nom,tel:tel,lieu:lieu,desc:desc,date:today(),traite:false,rappel:false,devisValide:false});
  sauverEnLigne().then(function(){
    document.getElementById('dem-nom').value='';
    document.getElementById('dem-tel').value='';
    document.getElementById('dem-lieu').value='';
    document.getElementById('dem-desc').value='';
    renderDemandes();
    alert('Demande ajoutee !');
  });
}

function toggleDemandeTraite(i,checked){
  demandes[i].traite=checked;
  sauverEnLigne().then(function(){renderDemandes();});
}

function toggleRappel(i,checked){
  demandes[i].rappel=checked;
  sauverEnLigne().then(function(){renderDemandes();});
}

function toggleDevisValide(i,checked){
  if(checked){
    if(confirm('Creer automatiquement un chantier a partir de cette demande ?')){
      var d=demandes[i];
      var notes='Demande origine :\n'+(d.desc||'');
      if(d.lieu) notes+='\nLieu : '+d.lieu;
      if(d.tel) notes+='\nTel : '+d.tel;
      chantiers.push({
        client:d.nom||'Client demande',
        devis:0,
        date:today(),
        responsable:'Aymeric',
        declare:true,
        virement:false,
        livre:false,
        jours:0,
        notes:notes,
        depenses:[]
      });
      // Supprimer la demande de la liste
      demandes.splice(i,1);
      sauverEnLigne().then(function(){
        renderDemandes();
        alert('Chantier cree ! Ouvre-le dans Liste pour completer les infos.');
        showSection('liste');
      });
    }
  } else {
    demandes[i].devisValide=false;
    sauverEnLigne().then(function(){renderDemandes();});
  }
}

function supprimerDemandeDirecte(i){
  if(!confirm('Supprimer cette demande ?'))return;
  demandes.splice(i,1);
  sauverEnLigne().then(function(){renderDemandes();});
}

function renderDemandes(){
  var container=document.getElementById('demandes-list');
  if(!demandes.length){container.innerHTML='<div class="empty-state"><div class="icon">📞</div>Aucune demande.</div>';return;}
  var liste=demandes.slice();
  liste.sort(function(a,b){
    if(a.rappel&&!b.rappel) return -1;
    if(!a.rappel&&b.rappel) return 1;
    return new Date(a.date)-new Date(b.date);
  });
  container.innerHTML=liste.map(function(d){
    var realIndex=demandes.indexOf(d);
    var jours=joursDepuis(d.date);
    var badgeCls=d.rappel?'badge-rappel':jours<=3?'badge-vert':jours<=7?'badge-orange':'badge-rouge';
    var joursLabel=d.rappel?'A RAPPELER':jours===0?'Aujourd\'hui':jours===1?'Hier':jours+' jours';
    var cardCls=d.rappel?'demande-card rappel':jours<=3?'demande-card':jours<=7?'demande-card orange':'demande-card rouge';
    var statusBadges='';
    if(d.traite) statusBadges+='<span class="status-badge status-validation">EN COURS DE VALIDATION</span> ';
    return '<div class="'+cardCls+'">' +
      (statusBadges?'<div style="margin-bottom:8px">'+statusBadges+'</div>':'') +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start"><div class="demande-nom">'+(d.nom||'Client inconnu')+'</div><span class="badge-urgence '+badgeCls+'">'+joursLabel+'</span></div>' +
      (d.lieu?'<div style="font-size:12px;color:var(--muted);margin-top:3px;">📍 '+d.lieu+'</div>':'') +
      '<div class="demande-desc">'+d.desc+'</div>' +
      '<div class="demande-meta">'+(d.tel?'<div class="demande-tel">📞 '+d.tel+'</div>':'<div></div>')+'<div class="tag-date">'+d.date+'</div></div>' +
      '<div class="check-row" onclick="event.stopPropagation()"><input type="checkbox" '+(d.traite?'checked':'')+' onchange="toggleDemandeTraite('+realIndex+',this.checked)" /><span>Demande traitee (en cours de validation)</span></div>' +
      '<div class="check-row" onclick="event.stopPropagation()"><input type="checkbox" '+(d.rappel?'checked':'')+' onchange="toggleRappel('+realIndex+',this.checked)" /><span>A rappeler - remonte en haut</span></div>' +
      '<div class="check-row" onclick="event.stopPropagation()"><input type="checkbox" '+(d.devisValide?'checked':'')+' onchange="toggleDevisValide('+realIndex+',this.checked)" /><span>Devis valide - creer le chantier</span></div>' +
      '<button class="btn-suppr-dem" onclick="event.stopPropagation();supprimerDemandeDirecte('+realIndex+')">Supprimer cette demande</button>' +
    '</div>';
  }).join('');
}

function ouvrirDemande(i){
  demandeEditIndex=i;
  var d=demandes[i];
  document.getElementById('dem-edit-nom').value=d.nom||'';
  document.getElementById('dem-edit-tel').value=d.tel||'';
  document.getElementById('dem-edit-lieu').value=d.lieu||'';
  document.getElementById('dem-edit-desc').value=d.desc||'';
  document.getElementById('demande-modal-overlay').classList.add('open');
}
function fermerDemande(){document.getElementById('demande-modal-overlay').classList.remove('open');demandeEditIndex=null;}
function sauvegarderDemande(){
  demandes[demandeEditIndex].nom=document.getElementById('dem-edit-nom').value.trim();
  demandes[demandeEditIndex].tel=document.getElementById('dem-edit-tel').value.trim();
  demandes[demandeEditIndex].lieu=document.getElementById('dem-edit-lieu').value.trim();
  demandes[demandeEditIndex].desc=document.getElementById('dem-edit-desc').value.trim();
  sauverEnLigne().then(function(){fermerDemande();renderDemandes();});
}
function supprimerDemande(){
  if(!confirm('Supprimer cette demande ?'))return;
  demandes.splice(demandeEditIndex,1);
  sauverEnLigne().then(function(){fermerDemande();renderDemandes();});
}

function renderBilan(){
  var container=document.getElementById('bilan-content');
  if(!chantiers.length){container.innerHTML='<div class="empty-state"><div class="icon">📊</div>Aucune donnee.</div>';return;}
  var tDevis=0,tUrssaf=0,tDepFab=0,tDepAym=0,tFab=0,tAym=0,soldeNonVire=0;
  var sorted=chantiers.slice().sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  var rows=sorted.map(function(c){
    var i=chantiers.indexOf(c);
    var r=calcChantier(c);
    tDevis+=r.devis;tUrssaf+=r.urssaf;tDepFab+=r.depFab;tDepAym+=r.depAym;tFab+=r.recoit_fab;tAym+=r.recoit_aym;
    if(!c.virement){if(r.transfert.de==='Aymeric'&&r.transfert.a==='Fabrice'){soldeNonVire+=r.transfert.mnt;}else{soldeNonVire-=r.transfert.mnt;}}
    var chipClass=c.responsable==='Fabrice'?'chip-fab':'chip-aym';
    var urssafLabel=c.declare!==false?'URSSAF 24%':'EN ESPECES';
    var urssafVal=c.declare!==false?('-'+fmt(r.urssaf)):'<span style="color:var(--accent);font-weight:800">EN ESPECES</span>';
    var jours=parseInt(c.jours)||0;
    var perfHtml='';
    if(jours>0){var obj=jours*OBJECTIF_JOUR;var diff=r.part-obj;var pj=r.part/jours;var cls=diff>=0?'perf-ok':'perf-bad';perfHtml='<div class="perf-result '+cls+'">'+(diff>=0?'BON':'INSUFFISANT')+' - '+fmt(pj)+' / jour'+(diff>=0?' (+'+fmt(diff)+')':' ('+fmt(diff)+')')+'</div>';}
    return '<div class="card" style="cursor:default'+(c.livre?';opacity:0.6;border-style:dashed':'')+'">' +
      (c.declare===false?'<div class="especes-badge">EN ESPECES</div>':'') +
      (c.livre?'<div style="font-size:11px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">TERMINE</div>':'') +
      '<div class="card-header"><div><div class="client-name">'+c.client+'</div><div class="tag-date">'+(c.date||'')+'</div></div><div class="chip '+chipClass+'">'+c.responsable+'</div></div>' +
      '<div class="row"><label>Devis</label><span class="mono yellow">'+fmt(r.devis)+'</span></div>' +
      '<div class="row"><label>'+urssafLabel+'</label><span class="mono red">'+urssafVal+'</span></div>' +
      '<div class="row"><label>Dep. Fabrice</label><span class="mono red">-'+fmt(r.depFab)+'</span></div>' +
      '<div class="row"><label>Dep. Aymeric</label><span class="mono red">-'+fmt(r.depAym)+'</span></div>' +
      '<hr class="divider">' +
      '<div class="person-row"><div class="person-label"><div class="dot dot-fab"></div>Fabrice recoit</div><span class="mono blue">'+fmt(r.recoit_fab)+'</span></div>' +
      '<div class="person-row"><div class="person-label"><div class="dot dot-aym"></div>Aymeric recoit</div><span class="mono orange">'+fmt(r.recoit_aym)+'</span></div>' +
      '<div class="arrow-box"><strong>'+r.transfert.de+'</strong> verse <strong>'+fmt(r.transfert.mnt)+'</strong> a '+r.transfert.a+'</div>' +
      '<div class="perf-box"><label>Nb de jours travailles</label><div class="perf-input-row"><input type="number" min="0" value="'+(c.jours||0)+'" onchange="updateJours('+i+',this.value)" onclick="event.stopPropagation()" style="width:80px" /><span style="font-size:12px;color:var(--muted);">jours - objectif '+OBJECTIF_JOUR+' euros/jour/pers</span></div>'+perfHtml+'</div>' +
      '<div class="check-row"><input type="checkbox" '+(c.livre?'checked':'')+' onchange="toggleLivre('+i+',this.checked)" onclick="event.stopPropagation()" /><span>Chantier termine</span></div>' +
      '<div class="check-row"><input type="checkbox" '+(c.virement?'checked':'')+' onchange="toggleVirement('+i+',this.checked)" onclick="event.stopPropagation()" /><span>Virement effectue</span></div>' +
    '</div>';
  }).join('');
  var aRegler;
  if(soldeNonVire>0.01){aRegler='<strong>Fabrice</strong> doit recevoir <strong>'+fmt(soldeNonVire)+'</strong> de Aymeric';}
  else if(soldeNonVire<-0.01){aRegler='<strong>Aymeric</strong> doit recevoir <strong>'+fmt(-soldeNonVire)+'</strong> de Fabrice';}
  else{aRegler='Tout est regle entre vous deux';}
  container.innerHTML=
    '<div class="summary-block"><h3>Recapitulatif global</h3>' +
    '<div class="row"><label>CA total</label><span class="mono yellow">'+fmt(tDevis)+'</span></div>' +
    '<div class="row"><label>URSSAF totale</label><span class="mono red">-'+fmt(tUrssaf)+'</span></div>' +
    '<div class="row"><label>Dep. totales Fabrice</label><span class="mono red">-'+fmt(tDepFab)+'</span></div>' +
    '<div class="row"><label>Dep. totales Aymeric</label><span class="mono red">-'+fmt(tDepAym)+'</span></div>' +
    '<hr class="divider">' +
    '<div class="person-row"><div class="person-label"><div class="dot dot-fab"></div>Total Gain Net Fabrice</div><div class="big-number blue">'+fmt(tFab)+'</div></div>' +
    '<div class="person-row"><div class="person-label"><div class="dot dot-aym"></div>Total Gain Net Aymeric</div><div class="big-number orange">'+fmt(tAym)+'</div></div>' +
    '<div class="arrow-box-big">A regler maintenant :<br>'+aRegler+'</div>' +
    '</div>'+rows;
}

function exporterExcel(){
  var BOM='\uFEFF';
  var csv=BOM+'Client;Date;Responsable;Declare;Termine;Solde;Jours;Devis;URSSAF;Dep.Fabrice;Dep.Aymeric;Net;Part Fabrice;Part Aymeric;Transfert;Notes\n';
  chantiers.forEach(function(c){
    var r=calcChantier(c);
    csv+='"'+c.client+'";"'+(c.date||'')+'"; "'+c.responsable+'";"'+(c.declare!==false?'Oui':'Non')+'"; "'+(c.livre?'Oui':'Non')+'"; "'+(c.virement?'Solde':'En cours')+'"; "'+(c.jours||0)+'"; "'+r.devis.toFixed(2)+'"; "'+r.urssaf.toFixed(2)+'"; "'+r.depFab.toFixed(2)+'"; "'+r.depAym.toFixed(2)+'"; "'+r.resultatNet.toFixed(2)+'"; "'+r.recoit_fab.toFixed(2)+'"; "'+r.recoit_aym.toFixed(2)+'"; "'+r.transfert.de+' > '+r.transfert.a+' : '+r.transfert.mnt.toFixed(2)+' euro";"'+(c.notes||'')+'"\n';
  });
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='mes_chantiers.csv';a.click();
}

chargerDonnees();
