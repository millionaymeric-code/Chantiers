<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mes Chantiers</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --card: #222222;
    --border: #2e2e2e;
    --accent: #f0c040;
    --green: #4caf7d;
    --red: #e05c3a;
    --blue: #5b9cf6;
    --orange: #f0a040;
    --text: #f0ede6;
    --muted: #888;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 50px;
  }

  header {
    background: var(--surface);
    padding: 22px 20px 16px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  header h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
  header h1 span { color: var(--accent); }

  .sync-status {
    font-size: 11px;
    margin-top: 4px;
    font-family: 'DM Mono', monospace;
  }

  .sync-ok { color: var(--green); }
  .sync-loading { color: var(--orange); }
  .sync-error { color: var(--red); }

  nav {
    display: flex;
    gap: 6px;
    margin-top: 14px;
  }

  nav button {
    flex: 1;
    padding: 9px 4px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 10px;
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }

  nav button.active { background: var(--accent); color: #111; border-color: var(--accent); }

  .section { display: none; padding: 20px; }
  .section.active { display: block; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 14px;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }

  .client-name { font-size: 17px; font-weight: 700; }

  .chip {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 6px;
    font-weight: 600;
  }

  .chip-fab { background: rgba(91,156,246,0.15); color: var(--blue); }
  .chip-aym { background: rgba(240,160,64,0.15); color: var(--orange); }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }

  .row:last-child { border-bottom: none; }
  .row label { color: var(--muted); font-size: 13px; }

  .mono { font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500; }
  .green { color: var(--green); }
  .red { color: var(--red); }
  .yellow { color: var(--accent); }
  .blue { color: var(--blue); }
  .orange { color: var(--orange); }

  .divider { border: none; border-top: 1px dashed var(--border); margin: 10px 0; }

  .section-title { font-size: 18px; font-weight: 800; margin-bottom: 18px; }

  .form-group { margin-bottom: 14px; }

  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }

  input, select {
    width: 100%;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 13px 14px;
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s;
    -webkit-appearance: none;
  }

  input:focus, select:focus { border-color: var(--accent); }
  input[type="number"] { font-family: 'DM Mono', monospace; }

  .toggle-group { display: flex; gap: 8px; }

  .toggle-btn {
    flex: 1;
    padding: 12px;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }

  .toggle-btn.sel-fab { border-color: var(--blue); color: var(--blue); background: rgba(91,156,246,0.1); }
  .toggle-btn.sel-aym { border-color: var(--orange); color: var(--orange); background: rgba(240,160,64,0.1); }

  .btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s;
    margin-top: 10px;
  }

  .btn:active { opacity: 0.8; }
  .btn-primary { background: var(--accent); color: #111; }
  .btn-secondary { background: var(--surface); color: var(--text); border: 1.5px solid var(--border); }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-green { background: var(--green); color: #fff; }

  .depense-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
  }

  .depense-item:last-child { border-bottom: none; }

  .depense-who {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 5px;
    flex-shrink: 0;
  }

  .who-fab { background: rgba(91,156,246,0.15); color: var(--blue); }
  .who-aym { background: rgba(240,160,64,0.15); color: var(--orange); }

  .depense-desc { flex: 1; font-size: 13px; }
  .depense-mnt { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--red); flex-shrink: 0; }

  .del-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 2px 6px;
    line-height: 1;
    flex-shrink: 0;
  }

  .add-dep-grid {
    display: grid;
    grid-template-columns: 1fr 90px;
    gap: 8px;
    margin-top: 10px;
  }

  .add-dep-grid input { padding: 11px 12px; font-size: 14px; }

  .who-toggle { display: flex; gap: 6px; margin-top: 8px; }

  .who-btn {
    flex: 1;
    padding: 10px;
    border: 2px solid var(--border);
    border-radius: 9px;
    background: transparent;
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.15s;
  }

  .who-btn.sel-fab { border-color: var(--blue); color: var(--blue); background: rgba(91,156,246,0.1); }
  .who-btn.sel-aym { border-color: var(--orange); color: var(--orange); background: rgba(240,160,64,0.1); }

  .add-dep-btn {
    width: 100%;
    margin-top: 8px;
    padding: 11px;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: #111;
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    overflow-y: auto;
    padding: 20px;
  }

  .modal-overlay.open { display: block; }

  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    max-width: 500px;
    margin: 30px auto 60px;
  }

  .modal h2 { font-size: 18px; font-weight: 800; margin-bottom: 20px; }

  .summary-block {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 14px;
  }

  .summary-block h3 {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 14px;
  }

  .big-number {
    font-family: 'DM Mono', monospace;
    font-size: 28px;
    font-weight: 500;
    line-height: 1;
  }

  .person-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }

  .person-row:last-child { border-bottom: none; }

  .person-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
  }

  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .dot-fab { background: var(--blue); }
  .dot-aym { background: var(--orange); }

  .arrow-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-top: 12px;
    font-size: 13px;
    color: var(--text);
    line-height: 1.6;
  }

  .arrow-box strong { color: var(--accent); }

  .progress-bar-bg {
    height: 5px;
    background: var(--border);
    border-radius: 99px;
    margin-top: 10px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    border-radius: 99px;
    background: var(--green);
    transition: width 0.3s;
  }

  .progress-bar.over { background: var(--red); }
  .tag-date { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
    font-size: 14px;
  }

  .empty-state .icon { font-size: 36px; margin-bottom: 10px; }
  .sub-label { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
  }
</style>
</head>
<body>

<header>
  <h1>Mes <span>Chantiers</span></h1>
  <div class="sync-status" id="sync-status">⏳ Connexion...</div>
  <nav>
    <button class="active" onclick="showSection('liste')">📋 Liste</button>
    <button onclick="showSection('nouveau')">➕ Nouveau</button>
    <button onclick="showSection('bilan')">📊 Bilan</button>
  </nav>
</header>

<div id="liste" class="section active">
  <p class="section-title">Chantiers en cours</p>
  <div id="chantiers-list"></div>
</div>

<div id="nouveau" class="section">
  <p class="section-title">Nouveau chantier</p>
  <div class="card">
    <div class="form-group">
      <label>Nom du client</label>
      <input type="text" id="new-client" placeholder="Ex: Dupont Jean" />
    </div>
    <div class="form-group">
      <label>Montant du devis (€)</label>
      <input type="number" id="new-devis" placeholder="0.00" step="0.01" min="0" />
    </div>
    <div class="form-group">
      <label>Responsable du chantier (qui encaisse)</label>
      <div class="toggle-group">
        <button class="toggle-btn" id="btn-resp-fab" onclick="setResp('Fabrice')">🔵 Fabrice</button>
        <button class="toggle-btn" id="btn-resp-aym" onclick="setResp('Aymeric')">🟠 Aymeric</button>
      </div>
      <p class="sub-label" id="resp-hint">Personne non sélectionnée</p>
    </div>
    <div class="form-group">
      <label>Date (optionnel)</label>
      <input type="date" id="new-date" />
    </div>
    <button class="btn btn-primary" onclick="ajouterChantier()">Créer le chantier</button>
  </div>
</div>

<div id="bilan" class="section">
  <p class="section-title">Bilan global</p>
  <div id="bilan-content"></div>
  <button class="btn btn-green" onclick="exporterExcel()">⬇️ Télécharger Excel</button>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2 id="modal-title">Chantier</h2>
    <div class="form-group">
      <label>Client</label>
      <input type="text" id="edit-client" />
    </div>
    <div class="form-group">
      <label>Montant devis (€)</label>
      <input type="number" id="edit-devis" step="0.01" />
    </div>
    <div class="form-group">
      <label>Responsable (qui encaisse)</label>
      <div class="toggle-group">
        <button class="toggle-btn" id="edit-btn-fab" onclick="setEditResp('Fabrice')">🔵 Fabrice</button>
        <button class="toggle-btn" id="edit-btn-aym" onclick="setEditResp('Aymeric')">🟠 Aymeric</button>
      </div>
    </div>
    <div class="form-group">
      <label>Dépenses</label>
      <div id="edit-depenses-list"></div>
      <div style="margin-top:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <p style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;">Ajouter une dépense</p>
        <div class="add-dep-grid">
          <input type="text" id="dep-desc" placeholder="Description" />
          <input type="number" id="dep-mnt" placeholder="€" step="0.01" min="0" />
        </div>
        <div class="who-toggle">
          <button class="who-btn" id="who-btn-fab" onclick="setWho('Fabrice')">🔵 Fabrice</button>
          <button class="who-btn" id="who-btn-aym" onclick="setWho('Aymeric')">🟠 Aymeric</button>
        </div>
        <button class="add-dep-btn" onclick="ajouterDepense()">+ Ajouter</button>
      </div>
    </div>
    <button class="btn btn-primary" onclick="sauvegarderChantier()">💾 Sauvegarder</button>
    <button class="btn btn-secondary" onclick="fermerModal()">Annuler</button>
    <button class="btn btn-danger" onclick="supprimerChantier()">🗑 Supprimer ce chantier</button>
  </div>
</div>

<script>
// ---- CONFIG JSONBIN ----
const BIN_ID = '6a21d867da38895dfe888684';
const API_KEY = '$2a$10$NRRQdixtQ/NsijZcDxQ47OYwm3YGBJXnv56wrj6SZJOokRbWEhRa6';
const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

// ---- STATE ----
let chantiers = [];
let editIndex = null;
let newResp = null;
let editResp = null;
let depWho = null;

const URSSAF = 0.23;

function fmt(n) {
  return Number(n).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
}

function today() { return new Date().toISOString().split('T')[0]; }

function setStatus(msg, type) {
  const el = document.getElementById('sync-status');
  el.textContent = msg;
  el.className = 'sync-status ' + type;
}

// ---- JSONBIN API ----
async function chargerDonnees() {
  setStatus('⏳ Chargement...', 'sync-loading');
  try {
    const res = await fetch(API_URL + '/latest', {
      headers: { 'X-Access-Key': API_KEY }
    });
    const data = await res.json();
    chantiers = data.record.chantiers || [];
    setStatus('✅ Synchronisé', 'sync-ok');
    renderListe();
  } catch(e) {
    setStatus('❌ Erreur de connexion', 'sync-error');
  }
}

async function sauverEnLigne() {
  setStatus('⏳ Sauvegarde...', 'sync-loading');
  try {
    await fetch(API_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Access-Key': API_KEY
      },
      body: JSON.stringify({ chantiers })
    });
    setStatus('✅ Synchronisé', 'sync-ok');
  } catch(e) {
    setStatus('❌ Erreur sauvegarde', 'sync-error');
  }
}

// ---- CALCUL ----
function calcChantier(c) {
  const devis = parseFloat(c.devis) || 0;
  const urssaf = devis * URSSAF;
  const net = devis - urssaf;
  const depenses = c.depenses || [];
  const depFab = depenses.filter(d => d.who === 'Fabrice').reduce((s, d) => s + (parseFloat(d.mnt) || 0), 0);
  const depAym = depenses.filter(d => d.who === 'Aymeric').reduce((s, d) => s + (parseFloat(d.mnt) || 0), 0);
  const totalDep = depFab + depAym;
  const resultatNet = net - totalDep;
  const partChacun = resultatNet / 2;
  const resp = c.responsable;
  let recoit_fab, recoit_aym, transfert;
  if (resp === 'Fabrice') {
    const donne = partChacun + depAym;
    recoit_fab = partChacun;
    recoit_aym = donne;
    transfert = { de: 'Fabrice', a: 'Aymeric', mnt: donne };
  } else {
    const donne = partChacun + depFab;
    recoit_aym = partChacun;
    recoit_fab = donne;
    transfert = { de: 'Aymeric', a: 'Fabrice', mnt: donne };
  }
  return { devis, urssaf, net, depFab, depAym, totalDep, resultatNet, partChacun, recoit_fab, recoit_aym, transfert };
}

// ---- NAVIGATION ----
function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  ['liste','nouveau','bilan'].forEach((s, i) => {
    if (s === id) document.querySelectorAll('nav button')[i].classList.add('active');
  });
  if (id === 'liste') { chargerDonnees(); }
  if (id === 'bilan') { chargerDonnees().then(() => renderBilan()); }
}

// ---- RESPONSABLE ----
function setResp(who) {
  newResp = who;
  document.getElementById('btn-resp-fab').className = 'toggle-btn' + (who === 'Fabrice' ? ' sel-fab' : '');
  document.getElementById('btn-resp-aym').className = 'toggle-btn' + (who === 'Aymeric' ? ' sel-aym' : '');
  const color = who === 'Fabrice' ? '#5b9cf6' : '#f0a040';
  document.getElementById('resp-hint').innerHTML = `<span style="color:${color}">${who}</span> encaisse le devis et paie l'URSSAF`;
}

function setEditResp(who) {
  editResp = who;
  document.getElementById('edit-btn-fab').className = 'toggle-btn' + (who === 'Fabrice' ? ' sel-fab' : '');
  document.getElementById('edit-btn-aym').className = 'toggle-btn' + (who === 'Aymeric' ? ' sel-aym' : '');
}

function setWho(who) {
  depWho = who;
  document.getElementById('who-btn-fab').className = 'who-btn' + (who === 'Fabrice' ? ' sel-fab' : '');
  document.getElementById('who-btn-aym').className = 'who-btn' + (who === 'Aymeric' ? ' sel-aym' : '');
}

// ---- LISTE ----
function renderListe() {
  const container = document.getElementById('chantiers-list');
  if (!chantiers.length) {
    container.innerHTML = `<div class="empty-state"><div class="icon">🏗️</div>Aucun chantier.<br>Appuie sur ➕ pour commencer.</div>`;
    return;
  }
  container.innerHTML = chantiers.map((c, i) => {
    const r = calcChantier(c);
    const chipClass = c.responsable === 'Fabrice' ? 'chip-fab' : 'chip-aym';
    const pct = r.net > 0 ? Math.min((r.totalDep / r.net) * 100, 100) : 0;
    const over = r.totalDep > r.net;
    return `
    <div class="card" onclick="ouvrirModal(${i})">
      <div class="card-header">
        <div>
          <div class="client-name">${c.client}</div>
          <div class="tag-date">${c.date || ''}</div>
        </div>
        <div class="chip ${chipClass}">⚡ ${c.responsable || '?'}</div>
      </div>
      <div class="row"><label>Devis</label><span class="mono yellow">${fmt(r.devis)}</span></div>
      <div class="row"><label>URSSAF (23%)</label><span class="mono red">−${fmt(r.urssaf)}</span></div>
      <div class="row"><label>Dép. Fabrice</label><span class="mono red">−${fmt(r.depFab)}</span></div>
      <div class="row"><label>Dép. Aymeric</label><span class="mono red">−${fmt(r.depAym)}</span></div>
      <hr class="divider">
      <div class="row"><label>Part Fabrice 🔵</label><span class="mono blue">${fmt(r.recoit_fab)}</span></div>
      <div class="row"><label>Part Aymeric 🟠</label><span class="mono orange">${fmt(r.recoit_aym)}</span></div>
      <div class="row"><label><b>Net total</b></label><span class="mono ${r.resultatNet >= 0 ? 'green' : 'red'}"><b>${fmt(r.resultatNet)}</b></span></div>
      <div class="arrow-box" style="margin-top:10px">💸 <strong>${r.transfert.de}</strong> verse <strong>${fmt(r.transfert.mnt)}</strong> à ${r.transfert.a}</div>
      <div class="progress-bar-bg" style="margin-top:10px"><div class="progress-bar ${over ? 'over' : ''}" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}

// ---- AJOUTER ----
async function ajouterChantier() {
  const client = document.getElementById('new-client').value.trim();
  const devis = document.getElementById('new-devis').value;
  const date = document.getElementById('new-date').value || today();
  if (!client || !devis) { alert('Remplis le nom et le montant du devis.'); return; }
  if (!newResp) { alert('Choisis le responsable du chantier.'); return; }
  chantiers.push({ client, devis: parseFloat(devis), date, responsable: newResp, depenses: [] });
  await sauverEnLigne();
  document.getElementById('new-client').value = '';
  document.getElementById('new-devis').value = '';
  document.getElementById('new-date').value = '';
  newResp = null;
  document.getElementById('btn-resp-fab').className = 'toggle-btn';
  document.getElementById('btn-resp-aym').className = 'toggle-btn';
  document.getElementById('resp-hint').textContent = 'Personne non sélectionnée';
  alert('Chantier créé ! ✅');
  showSection('liste');
}

// ---- MODAL ----
function ouvrirModal(i) {
  editIndex = i;
  depWho = null;
  const c = chantiers[i];
  document.getElementById('modal-title').textContent = c.client;
  document.getElementById('edit-client').value = c.client;
  document.getElementById('edit-devis').value = c.devis;
  document.getElementById('dep-desc').value = '';
  document.getElementById('dep-mnt').value = '';
  document.getElementById('who-btn-fab').className = 'who-btn';
  document.getElementById('who-btn-aym').className = 'who-btn';
  setEditResp(c.responsable || 'Fabrice');
  renderDepensesModal();
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('modal-overlay').scrollTop = 0;
}

function fermerModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  editIndex = null;
}

function renderDepensesModal() {
  const list = document.getElementById('edit-depenses-list');
  const depenses = chantiers[editIndex]?.depenses || [];
  if (!depenses.length) {
    list.innerHTML = '<p style="color:var(--muted);font-size:13px;padding:6px 0;">Aucune dépense</p>';
    return;
  }
  list.innerHTML = depenses.map((d, i) => {
    const whoClass = d.who === 'Fabrice' ? 'who-fab' : 'who-aym';
    return `
    <div class="depense-item">
      <span class="depense-who ${whoClass}">${d.who === 'Fabrice' ? '🔵' : '🟠'} ${d.who}</span>
      <span class="depense-desc">${d.desc}</span>
      <span class="depense-mnt">−${fmt(d.mnt)}</span>
      <button class="del-btn" onclick="supprimerDepense(${i})">×</button>
    </div>`;
  }).join('');
}

async function ajouterDepense() {
  const desc = document.getElementById('dep-desc').value.trim() || 'Dépense';
  const mnt = parseFloat(document.getElementById('dep-mnt').value);
  if (!mnt || mnt <= 0) { alert('Entre un montant valide.'); return; }
  if (!depWho) { alert('Choisis qui a payé cette dépense.'); return; }
  chantiers[editIndex].depenses.push({ desc, mnt, who: depWho });
  await sauverEnLigne();
  document.getElementById('dep-desc').value = '';
  document.getElementById('dep-mnt').value = '';
  depWho = null;
  document.getElementById('who-btn-fab').className = 'who-btn';
  document.getElementById('who-btn-aym').className = 'who-btn';
  renderDepensesModal();
}

async function supprimerDepense(i) {
  chantiers[editIndex].depenses.splice(i, 1);
  await sauverEnLigne();
  renderDepensesModal();
}

async function sauvegarderChantier() {
  const client = document.getElementById('edit-client').value.trim();
  const devis = parseFloat(document.getElementById('edit-devis').value);
  if (!client || !devis) { alert('Données incomplètes.'); return; }
  chantiers[editIndex].client = client;
  chantiers[editIndex].devis = devis;
  chantiers[editIndex].responsable = editResp;
  await sauverEnLigne();
  fermerModal();
  renderListe();
}

async function supprimerChantier() {
  if (!confirm('Supprimer ce chantier ?')) return;
  chantiers.splice(editIndex, 1);
  await sauverEnLigne();
  fermerModal();
  renderListe();
}

// ---- BILAN ----
function renderBilan() {
  const container = document.getElementById('bilan-content');
  if (!chantiers.length) {
    container.innerHTML = `<div class="empty-state"><div class="icon">📊</div>Aucune donnée.</div>`;
    return;
  }
  let totalDevis=0, totalUrssaf=0, totalDepFab=0, totalDepAym=0, totalNet=0, totalFab=0, totalAym=0;
  const rows = chantiers.map(c => {
    const r = calcChantier(c);
    totalDevis+=r.devis; totalUrssaf+=r.urssaf; totalDepFab+=r.depFab;
    totalDepAym+=r.depAym; totalNet+=r.resultatNet; totalFab+=r.recoit_fab; totalAym+=r.recoit_aym;
    const chipClass = c.responsable === 'Fabrice' ? 'chip-fab' : 'chip-aym';
    return `
    <div class="card">
      <div class="card-header">
        <div><div class="client-name">${c.client}</div><div class="tag-date">${c.date||''}</div></div>
        <div class="chip ${chipClass}">⚡ ${c.responsable}</div>
      </div>
      <div class="row"><label>Devis</label><span class="mono yellow">${fmt(r.devis)}</span></div>
      <div class="row"><label>URSSAF 23%</label><span class="mono red">−${fmt(r.urssaf)}</span></div>
      <div class="row"><label>Dép. 🔵 Fabrice</label><span class="mono red">−${fmt(r.depFab)}</span></div>
      <div class="row"><label>Dép. 🟠 Aymeric</label><span class="mono red">−${fmt(r.depAym)}</span></div>
      <hr class="divider">
      <div class="person-row"><div class="person-label"><div class="dot dot-fab"></div>Fabrice reçoit</div><span class="mono blue">${fmt(r.recoit_fab)}</span></div>
      <div class="person-row"><div class="person-label"><div class="dot dot-aym"></div>Aymeric reçoit</div><span class="mono orange">${fmt(r.recoit_aym)}</span></div>
      <div class="arrow-box">💸 <strong>${r.transfert.de}</strong> verse <strong>${fmt(r.transfert.mnt)}</strong> à ${r.transfert.a}</div>
    </div>`;
  }).join('');

  const diff = totalFab - totalAym;
  let transfertGlobal = diff > 0.01
    ? `💸 <strong>Aymeric</strong> doit verser <strong>${fmt(diff)}</strong> à Fabrice (cumul)`
    : diff < -0.01
    ? `💸 <strong>Fabrice</strong> doit verser <strong>${fmt(-diff)}</strong> à Aymeric (cumul)`
    : '✅ Équilibre parfait entre les deux';

  container.innerHTML = `
    <div class="summary-block">
      <h3>Récapitulatif global</h3>
      <div class="row"><label>CA total</label><span class="mono yellow">${fmt(totalDevis)}</span></div>
      <div class="row"><label>URSSAF totale</label><span class="mono red">−${fmt(totalUrssaf)}</span></div>
      <div class="row"><label>Dép. Fabrice</label><span class="mono red">−${fmt(totalDepFab)}</span></div>
      <div class="row"><label>Dép. Aymeric</label><span class="mono red">−${fmt(totalDepAym)}</span></div>
      <hr class="divider">
      <div class="person-row"><div class="person-label"><div class="dot dot-fab"></div>Total Fabrice</div><div class="big-number blue">${fmt(totalFab)}</div></div>
      <div class="person-row"><div class="person-label"><div class="dot dot-aym"></div>Total Aymeric</div><div class="big-number orange">${fmt(totalAym)}</div></div>
      <div class="arrow-box" style="margin-top:12px">${transfertGlobal}</div>
    </div>
    ${rows}`;
}

// ---- EXPORT ----
function exporterExcel() {
  const BOM = '\uFEFF';
  let csv = BOM + 'Client;Date;Responsable;Devis (€);URSSAF 23% (€);Dép. Fabrice (€);Dép. Aymeric (€);Net total (€);Part Fabrice (€);Part Aymeric (€);Transfert\n';
  chantiers.forEach(c => {
    const r = calcChantier(c);
    csv += `"${c.client}";"${c.date||''}";"${c.responsable||''}";"${r.devis.toFixed(2)}";"${r.urssaf.toFixed(2)}";"${r.depFab.toFixed(2)}";"${r.depAym.toFixed(2)}";"${r.resultatNet.toFixed(2)}";"${r.recoit_fab.toFixed(2)}";"${r.recoit_aym.toFixed(2)}";"${r.transfert.de} → ${r.transfert.a} : ${r.transfert.mnt.toFixed(2)} €"\n`;
    (c.depenses||[]).forEach(d => {
      csv += `"  └ ${d.desc}";;;"payé par ${d.who}";;;"${d.who==='Fabrice'?d.mnt.toFixed(2):''}";"${d.who==='Aymeric'?d.mnt.toFixed(2):''}";;;\n`;
    });
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'mes_chantiers.csv';
  a.click();
}

chargerDonnees();
</script>
